<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>IPTV </title>
<style>
body {
  background-color: #0a1f2f;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: linear-gradient(135deg, #064e3b, #0d9488);
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  width: 350px;
  box-shadow: 0 0 20px #0d9488;
}

h1 {
  color: #a5f3fc;
  margin-bottom: 15px;
}

img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 15px;
}

.offer {
  background-color: #10b981;
  padding: 5px 10px;
  border-radius: 5px;
  display: inline-block;
  margin-bottom: 10px;
  font-weight: bold;
  font-size: 14px;
  transform: translateY(-5px);
}

.price {
  font-size: 22px;
  color: #a5f3fc;
  margin: 10px 0;
  font-weight: bold;
}

button {
  background-color: #22c55e;
  color: white;
  font-size: 18px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #16a34a;
}
</style>
</head>
<body>

<div class="container">
  <h1>اشتراك IPTV ديال خويا</h1>

  <img src="https://i.imgur.com/6XbZQZC.jpg" alt="IPTV">

  <div class="offer">🔥 عرض خاص هذا الأسبوع!</div>

  <p class="price">100 درهم / شهر</p>

  <a href="https://wa.me/212666581222" target="_blank">
    <button>اشتري الآن</button>
  </a>
</div>

</body>
</html>
