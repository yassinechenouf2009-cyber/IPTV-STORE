<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Smart</title>
<style>
body {
    background-color: #0a1f2f;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #a5f3fc;
    margin-bottom: 30px;
}

/* حاوية العرضين */
.products {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap; /* responsive */
}

/* كل منتج */
.product {
    background: linear-gradient(135deg, #064e3b, #0d9488);
    padding: 20px;
    border-radius: 20px;
    width: 250px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* صورة المنتج */
.product img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
}

/* الثمن */
.price {
    font-size: 24px;
    color: #a5f3fc;
    font-weight: bold;
    margin-bottom: 15px;
}

/* زر واتساب */
.whatsapp-btn {
    background-color: #22c55e;
    color: white;
    font-size: 18px;
    padding: 12px 25px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: 0.3s;
    font-weight: bold;
}

.whatsapp-btn:hover {
    background-color: #16a34a;
    transform: translateY(-2px);
}

/* responsive للشاشات الصغيرة */
@media (max-width: 600px) {
    .products {
        flex-direction: column;
        align-items: center;
    }
    .product {
        width: 90%;
    }
}
</style>
</head>
<body>

<h1>IPTV Smart</h1>

<div class="products">
    <!-- المنتج الأول -->
    <div class="product">
        <img src="https://i.imgur.com/6XbZQZC.jpg" alt="IPTV 100">
        <div class="price">100 درهم</div>
        <a href="https://wa.me/212666581222" target="_blank">
            <button class="whatsapp-btn">اشتري الآن</button>
        </a>
    </div>

    <!-- المنتج الثاني -->
    <div class="product">
        <img src="https://i.imgur.com/N9B4XyF.png" alt="IPTV 200">
        <div class="price">200 درهم</div>
        <a href="https://wa.me/212666581222" target="_blank">
            <button class="whatsapp-btn">اشتري الآن</button>
        </a>
    </div>
</div>

</body>
</html>
