<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Smart</title>
<style>
body {
    background-color: #0a1f2f;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #a5f3fc;
    margin-bottom: 40px;
}

.products {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.product {
    background: linear-gradient(135deg,#064e3b,#0d9488);
    border-radius: 20px;
    width: 250px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    padding: 20px;
}

.product img {
    width: 100%;
    max-width: 220px;
    height: auto;
    margin: 0 auto 15px auto;
    display: block;
    border-radius: 15px;
}

.price {
    font-size: 26px;
    color: #a5f3fc;
    font-weight: bold;
    margin-bottom: 15px;
}

.whatsapp-btn {
    background-color: #22c55e;
    color: white;
    font-size: 18px;
    padding: 12px 25px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-weight: bold;
    transition: 0.3s;
}

.whatsapp-btn:hover {
    background-color: #16a34a;
    transform: translateY(-2px);
}

@media(max-width:600px) {
    .products {
        flex-direction: column;
        align-items: center;
    }
    .product {
        width: 90%;
    }
}
</style>
</head>
<body>

<h1>IPTV Smart</h1>

<div class="products">

<!-- العرض الأول -->
<div class="product">
<img src="https://i.imgur.com/0gRr5xL.png" alt="IPTV 100">
<div class="price">100 درهم</div>
<a href="https://wa.me/212666581222" target="_blank">
<button class="whatsapp-btn">اشتري الآن</button>
</a>
</div>

<!-- العرض الثاني -->
<div class="product">
<img src="https://i.imgur.com/5J0Fhbv.png" alt="IPTV 200">
<div class="price">200 درهم</div>
<a href="https://wa.me/212666581222" target="_blank">
<button class="whatsapp-btn">اشتري الآن</button>
</a>
</div>

</div>

</body>
</html>
